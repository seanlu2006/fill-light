# Generate FillLight.xcodeproj with `xcodegen` (brew install xcodegen).
# The generated project is committed, so you only need XcodeGen if you change this file.
name: FillLight
options:
  bundleIdPrefix: io.github.seanlu2006
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FillLight:
    type: application
    platform: iOS
    sources:
      - path: FillLight
      - path: ../Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.seanlu2006.FillLight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FillLight
        INFOPLIST_KEY_NSCameraUsageDescription: "FillLight shows your front camera inside the ring so you can see how you're lit. Nothing is recorded or sent anywhere."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
